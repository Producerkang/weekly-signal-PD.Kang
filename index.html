<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>WEEKLY SIGNAL</title>
  <style>
    :root{--ink:#101114;--accent:#ff4a2f}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--ink);color:#fff;font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    body{overflow:hidden;opacity:1;transition:opacity .28s ease}
    html.leaving body{opacity:0}
    main{min-height:100svh;display:grid;place-items:center;padding:28px;text-align:center;position:relative;isolation:isolate}
    main::before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(circle at 50% 46%,rgba(255,74,47,.14),transparent 28%),linear-gradient(135deg,rgba(255,255,255,.025),transparent 42%)}
    main::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.32;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(circle at center,#000,transparent 72%)}
    .splash{width:min(520px,100%);transform:translateY(-2vh);animation:enter .7s cubic-bezier(.22,.8,.25,1) both}
    .brand{font-size:clamp(17px,4vw,24px);font-weight:950;letter-spacing:.2em;padding-left:.2em}
    .signal{width:86px;height:86px;margin:28px auto 26px;position:relative;display:grid;place-items:center}
    .signal::before,.signal::after{content:"";position:absolute;border:1px solid rgba(255,74,47,.72);border-radius:50%;animation:ripple 1.55s ease-out infinite}
    .signal::after{animation-delay:.52s}
    .core{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 28px rgba(255,74,47,.95)}
    .status{font-family:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;font-size:clamp(24px,5vw,40px);line-height:1.4;margin:0;letter-spacing:-.03em}
    .hint{margin:13px 0 0;font-size:12px;letter-spacing:.08em;color:rgba(255,255,255,.5)}
    .loader{width:min(230px,62vw);height:2px;margin:32px auto 0;overflow:hidden;background:rgba(255,255,255,.12)}
    .loader::after{content:"";display:block;width:45%;height:100%;background:var(--accent);box-shadow:0 0 15px rgba(255,74,47,.72);animation:scan 1.2s ease-in-out infinite}
    .fallback{display:none;margin-top:26px;font-size:14px}.fallback a{color:#fff;text-underline-offset:5px}
    @keyframes enter{from{opacity:0;transform:translateY(calc(-2vh + 14px))}to{opacity:1;transform:translateY(-2vh)}}
    @keyframes ripple{0%{inset:39px;opacity:1}100%{inset:0;opacity:0}}
    @keyframes scan{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}body{transition:none}}
  </style>
</head>
<body>
  <main>
    <section class="splash" aria-live="polite">
      <div class="brand">WEEKLY SIGNAL</div>
      <div class="signal" aria-hidden="true"><span class="core"></span></div>
      <p class="status" id="status">최신호를 준비하고 있습니다.</p>
      <p class="hint">LATEST ISSUE LOADING</p>
      <div class="loader" id="loader" aria-hidden="true"></div>
      <p class="fallback" id="fallback"><a href="archive/">과월호 목록에서 열기</a></p>
    </section>
  </main>
  <script>
    (()=>{
      const started=performance.now();
      const minimumSplashMs=2000;
      const status=document.getElementById('status');
      const loader=document.getElementById('loader');
      const fallback=document.getElementById('fallback');
      const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
      const waitForMinimum=()=>delay(Math.max(0,minimumSplashMs-(performance.now()-started)));

      const waitForWorkerControl=async()=>{
        if(!('serviceWorker' in navigator))return;
        await navigator.serviceWorker.register('./reader-sw.js',{scope:'./'});
        await navigator.serviceWorker.ready;
        if(navigator.serviceWorker.controller)return;
        await new Promise((resolve,reject)=>{
          const timeout=setTimeout(()=>reject(new Error('service-worker-control-timeout')),5000);
          navigator.serviceWorker.addEventListener('controllerchange',()=>{clearTimeout(timeout);resolve()},{once:true});
        });
      };

      (async()=>{
        try{
          const workerReady=waitForWorkerControl();
          const issueReady=fetch(`./latest.json?t=${Date.now()}`,{cache:'no-store'})
            .then(response=>{if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json()})
            .then(latest=>{if(!latest.path||!latest.path.startsWith('archive/'))throw new Error('Invalid latest path');return new URL(latest.path,location.href).href});
          const [,target]=await Promise.all([workerReady,issueReady]);
          const prefetch=document.createElement('link');
          prefetch.rel='prefetch';
          prefetch.href=target;
          document.head.appendChild(prefetch);
          await waitForMinimum();
          document.documentElement.classList.add('leaving');
          await delay(280);
          location.replace(target);
        }catch(error){
          await waitForMinimum();
          status.textContent='최신호 연결을 확인할 수 없습니다.';
          loader.style.display='none';
          fallback.style.display='block';
          console.error(error);
        }
      })();
    })();
  </script>
  <noscript><style>.loader{display:none}.fallback{display:block}</style></noscript>
</body>
</html>
