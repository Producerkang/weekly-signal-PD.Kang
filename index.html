<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WEEKLY SIGNAL</title>
<style>
:root{color-scheme:dark;font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#07101c;color:#fff;padding:28px}
main{text-align:center;max-width:680px}.brand{font-size:13px;font-weight:900;letter-spacing:.18em}.line{width:58px;height:4px;background:#ff4a2f;margin:22px auto}
h1{font-family:"Noto Serif KR","Nanum Myeongjo",serif;font-size:clamp(28px,5vw,48px);line-height:1.3;margin:0}
p{color:rgba(255,255,255,.72)}a{color:#fff;font-weight:800}
</style>
</head>
<body>
<main role="status" aria-live="polite">
  <div class="brand">WEEKLY SIGNAL</div>
  <div class="line"></div>
  <h1>이번 주의 신호를<br>정리하고 있습니다</h1>
  <p id="status">최신호를 불러오는 중입니다.</p>
  <p><a href="./archive/">과월호 보기</a></p>
</main>
<script>
(async()=>{
  const status=document.getElementById('status');
  const started=Date.now();
  sessionStorage.setItem('wsSplashStarted',String(started));

  try{
    const workerReady=('serviceWorker' in navigator)
      ? navigator.serviceWorker.register('./reader-sw.js',{scope:'./'}).then(()=>navigator.serviceWorker.ready)
      : Promise.resolve();
    const issueReady=fetch('./latest.json',{cache:'no-store'})
      .then(response=>{if(!response.ok)throw new Error('latest.json');return response.json()})
      .then(issue=>{if(!issue.path)throw new Error('path');return issue.path});
    const minimum=new Promise(resolve=>setTimeout(resolve,2000));
    const [,path]=await Promise.all([Promise.all([workerReady,minimum]),issueReady]);
    location.replace(path);
  }catch(error){
    sessionStorage.removeItem('wsSplashStarted');
    status.textContent='최신호를 불러오지 못했습니다. 과월호 목록을 이용해 주세요.';
  }
})();
</script>
<noscript><p><a href="./archive/">과월호 목록에서 발행호를 선택해 주세요.</a></p></noscript>
</body>
</html>
