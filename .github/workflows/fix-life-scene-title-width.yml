name: Fix LIFE SCENE title width

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix-life-scene-title-width'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fix LIFE SCENE title width directly in canonical HTML
        run: |
          python - <<'PY'
          from pathlib import Path

          issue = Path('archive/2026-07-20/index.html')
          text = issue.read_text(encoding='utf-8')
          old = '#life-scene .life-head h2{max-width:760px!important;font-size:clamp(36px,4.6vw,56px)!important;line-height:1.16!important;letter-spacing:-.04em!important}'
          new = '#life-scene .life-head h2{max-width:none!important;font-size:clamp(36px,4.6vw,56px)!important;line-height:1.16!important;letter-spacing:-.04em!important}'
          if old not in text:
              raise SystemExit('Expected LIFE SCENE title-width rule not found')
          if text.count(old) != 1:
              raise SystemExit(f'Expected one title-width rule, found {text.count(old)}')
          text = text.replace(old, new, 1)
          issue.write_text(text, encoding='utf-8')

          layout = Path('editorial/LAYOUT_SYSTEM.md')
          doc = layout.read_text(encoding='utf-8')
          anchor = '- LIFE SCENE은 Contents 다음에 배치하며 이미지 비율·본문 관계는 해당 장면에 맞게 독립적으로 정한다.\n'
          rule = '- LIFE SCENE의 데스크톱 제목은 프런트 스프레드의 실제 가용 폭을 사용한다. 제목보다 좁은 임의의 `max-width`로 불필요한 줄바꿈을 만들지 않으며, 가용 폭에 들어오는 제목은 한 줄을 우선하고 좁은 화면에서만 자연스럽게 줄바꿈한다.\n'
          if rule not in doc:
              if anchor not in doc:
                  raise SystemExit('Layout standard insertion point not found')
              doc = doc.replace(anchor, anchor + rule, 1)
              layout.write_text(doc, encoding='utf-8')
          PY

      - name: Verify direct-edit structure
        run: |
          ! grep -q '#life-scene .life-head h2{max-width:760px' archive/2026-07-20/index.html
          grep -q '#life-scene .life-head h2{max-width:none!important' archive/2026-07-20/index.html
          grep -q 'LIFE SCENE의 데스크톱 제목은 프런트 스프레드의 실제 가용 폭을 사용한다' editorial/LAYOUT_SYSTEM.md
          test ! -e current-issue-rewrite.js
          test ! -e headline-opening-patch.js
          test ! -e reader-sw.js

      - name: Remove one-off workflow
        run: rm .github/workflows/fix-life-scene-title-width.yml

      - name: Commit direct edit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Let LIFE SCENE title use full desktop width'
          git push origin HEAD:${{ github.head_ref }}
