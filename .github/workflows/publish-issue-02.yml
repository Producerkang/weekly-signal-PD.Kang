name: Publish Issue 02 metadata
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-issue-02.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate and publish
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          issue=Path('archive/2026-07-27/index.html')
          text=issue.read_text(encoding='utf-8')
          required=['contents','life-scene','editors-pick','cover-story','economy','society','tech','data','watch','sources']
          missing=[x for x in required if f'id="{x}"' not in text]
          if missing: raise SystemExit(f'missing sections: {missing}')
          if re.search(r'opening|오프닝',text,re.I): raise SystemExit('legacy terminology remains')
          for src in re.findall(r'(?:src|href)="(\./[^"#?]+)"',text):
              p=issue.parent/src[2:]
              if not p.exists(): raise SystemExit(f'missing local asset: {src}')
          issues_path=Path('issues.json')
          issues=json.loads(issues_path.read_text(encoding='utf-8'))
          entry={
            'issueStart':'2026-07-27',
            'period':'2026-07-27/2026-08-02',
            'title':'폭염은 기온이 아니라 운영의 문제다',
            'path':'archive/2026-07-27/',
            'publishedAt':'2026-08-03T20:17:00+09:00'
          }
          issues=[x for x in issues if x.get('issueStart')!='2026-07-27']
          issues.insert(0,entry)
          issues_path.write_text(json.dumps(issues,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          history=Path('editorial/ISSUE_HISTORY.md')
          h=history.read_text(encoding='utf-8')
          marker='\n---\n\n## 새 호 기록 템플릿'
          record='''\n## Issue 02 — 2026.07.27–08.02\n\n### 발행 경로\n- `archive/2026-07-27/`\n\n### 최종 구성\n- Cover Story: 폭염 위기경보 심각 격상과 전력·현장 운영\n- Economy: 2027년 기준 중위소득 6.7% 인상\n- Society: 자살 고위험군 긴급대응과 온라인 24시간 모니터링\n- Tech: AI 가상인물 추천·보증 광고 표시\n- LIFE SCENE: 폭염 속 야외노동의 작업중지 권한\n- DATA: 핵심 수치 6개\n- WATCH: 작업중지·최대전력·복지수급·플랫폼 집행 후속 문서\n- SOURCES: 정부 공식 자료 6건\n\n### 편집 확인 사항\n- Contents 순서를 LIFE SCENE, Editor's Pick, Cover Story 순으로 유지했습니다.\n- `Opening` 명칭을 사용하지 않았습니다.\n- 발표·결정·전망과 실제 집행을 구분했습니다.\n- 표지와 LIFE SCENE은 저작권 제약이 없는 자체 SVG 편집 일러스트를 사용했습니다.\n- 필수 섹션 ID, 로컬 자산 경로와 내부 앵커를 기계적으로 확인했습니다.\n- 실제 브라우저 4개 화면의 육안 검수는 수행하지 못했으므로 통과로 기록하지 않습니다.\n\n### 다음 회차 적용 규칙\n1. 정책의 단계뿐 아니라 현장에서 행동을 바꾸는 권한과 운영기록을 확인합니다.\n2. 장문 기사 수를 늘리기보다 독립 공식 근거가 충분한 주제만 채택합니다.\n3. 발행 전 1440px·1366px·1024px·390px 실제 화면 검수를 별도로 수행합니다.\n\n'''
          if '## Issue 02 — 2026.07.27–08.02' not in h:
              h=h.replace(marker,'\n---\n'+record+'\n## 새 호 기록 템플릿')
              history.write_text(h,encoding='utf-8')
          Path('latest.json').write_text(json.dumps(entry,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-issue-02.yml
          git add issues.json latest.json editorial/ISSUE_HISTORY.md
          git commit -m "Publish WEEKLY SIGNAL Issue 02"
          git push origin HEAD:main