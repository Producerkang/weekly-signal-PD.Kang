name: Finalize standalone publication structure

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - migration/finalize-standalone.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-standalone-publication
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize publication structure
        run: node tools/finalize-standalone-structure.mjs
      - name: Commit finalized structure to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finalize standalone publication structure"
          git push origin HEAD:${{ github.head_ref }}
