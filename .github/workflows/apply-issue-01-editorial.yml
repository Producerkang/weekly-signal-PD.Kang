name: Apply issue 01 editorial revision

on:
  push:
    branches:
      - main
    paths:
      - tools/apply-issue-01-editorial.mjs
      - .github/workflows/apply-issue-01-editorial.yml
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply editorial migration
        run: node tools/apply-issue-01-editorial.mjs
      - name: Validate standalone issue
        run: node tools/validate-published-issue.mjs
      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply issue 01 editorial revisions"
          git push
