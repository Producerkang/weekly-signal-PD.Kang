name: Apply issue 01 editorial revision

on:
  issues:
    types:
      - opened
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[automation] apply issue 01 editorial revision'
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge trigger
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment ${{ github.event.issue.html_url }} --body "Editorial migration workflow started."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and validate
        id: migration
        shell: bash
        run: |
          set +e
          node tools/run-issue-01-editorial-migration.mjs > migration.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            node tools/validate-published-issue.mjs >> migration.log 2>&1
            status=$?
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat migration.log
          exit 0
      - name: Report failure
        if: github.event_name == 'issues' && steps.migration.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'Editorial migration failed:'
            echo '```text'
            tail -c 5000 migration.log
            echo '```'
          } > issue-comment.md
          gh issue comment ${{ github.event.issue.html_url }} --body-file issue-comment.md
      - name: Stop on failure
        if: steps.migration.outputs.status != '0'
        run: exit 1
      - name: Commit migration result
        if: steps.migration.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply issue 01 editorial revisions"
          git push
