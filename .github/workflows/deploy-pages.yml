name: Deploy approved publication

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PUBLISH to deploy the currently approved issues.json"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit publication confirmation
        shell: bash
        run: |
          if [[ "${{ inputs.confirm }}" != "PUBLISH" ]]; then
            echo "Deployment blocked: confirm input must be PUBLISH." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Validate publication repository
        run: python tools/validate_repository.py

      - name: Build whitelisted public artifact
        run: python tools/build_public_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
