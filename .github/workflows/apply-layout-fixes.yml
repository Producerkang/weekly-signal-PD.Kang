name: Apply layout fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-layout-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch current issue
        shell: python
        run: |
          from pathlib import Path

          path = Path('archive/2026-07-20/index.html')
          html = path.read_text(encoding='utf-8')

          css = r'''

/* layout-fix-2026-07-31 */
#issue-splash{position:fixed;inset:0;z-index:5000;display:grid;place-items:center;background:#07101c;color:#fff;opacity:1;visibility:visible;transition:opacity .35s ease,visibility .35s ease}
#issue-splash.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
.issue-splash-inner{text-align:center;padding:28px}.issue-splash-brand{font-size:13px;font-weight:950;letter-spacing:.2em}.issue-splash-line{width:58px;height:4px;margin:22px auto;background:var(--accent)}.issue-splash-copy{font-family:var(--serif);font-size:clamp(24px,4vw,42px);line-height:1.3;margin:0}.issue-splash-status{margin-top:14px;font-size:12px;color:rgba(255,255,255,.68)}

.article-rail{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))!important}
.article-rail .rail-card:not(:has(.rail-number)){display:none!important}

.reportage>*,.reportage-layout,.reportage-prose,.reportage-evidence,.reportage-source{width:min(820px,100%)!important;max-width:820px!important;margin-left:auto!important;margin-right:auto!important}
.reportage-title,.reportage-dek{max-width:820px!important;margin-left:auto!important;margin-right:auto!important}
.reportage-note{max-width:820px!important}

.dark .article-head .dek,.dark .article-body,.dark .article-body p,.dark .article-body h3,.dark .article-body blockquote,.dark .argument-card h3,.dark .source-links a{color:#f5f4ef!important}
.dark .argument-card p,.dark .muted{color:rgba(255,255,255,.74)!important}
.dark .rail-card:not(.dark-card){background:#f7f3ea!important;color:#101114!important}
.dark .rail-card:not(.dark-card) .rail-unit{color:#4d4a43!important}
#tech .article-head .dek,#tech .article-body,#tech .article-body p,#tech .article-body h3,#tech .argument-card h3,#tech .source-links a{color:#f5f4ef!important}
#tech .argument-card p{color:rgba(255,255,255,.74)!important}
#tech .source-links span:last-child{color:rgba(255,255,255,.62)!important}
#tech .verification-note,#tech .verification-note *{color:#101114!important}
.section:not(.dark):not(#tech) .article-head .dek,.section:not(.dark):not(#tech) .article-body,.section:not(.dark):not(#tech) .article-body p{color:#202124}

@media(max-width:660px){.reportage-evidence{grid-template-columns:1fr!important}.article-rail{grid-template-columns:1fr!important}}
@media(prefers-reduced-motion:reduce){#issue-splash{transition:none}}
'''

          splash = '''<div id="issue-splash" role="status" aria-live="polite" aria-label="WEEKLY SIGNAL 로딩 중"><div class="issue-splash-inner"><div class="issue-splash-brand">WEEKLY SIGNAL</div><div class="issue-splash-line"></div><p class="issue-splash-copy">이번 주의 신호를<br>정리하고 있습니다</p><div class="issue-splash-status">페이지를 불러오는 중입니다.</div></div></div>'''

          script = r'''
<script>
(()=>{
  const splash=document.getElementById('issue-splash');
  if(!splash)return;
  const minimum=new Promise(resolve=>setTimeout(resolve,2000));
  const loaded=document.readyState==='complete'
    ? Promise.resolve()
    : new Promise(resolve=>window.addEventListener('load',resolve,{once:true}));
  Promise.all([minimum,loaded]).then(()=>{
    splash.classList.add('is-hidden');
    splash.setAttribute('aria-hidden','true');
    setTimeout(()=>splash.remove(),450);
  });
})();
</script>
'''

          if 'layout-fix-2026-07-31' not in html:
              html = html.replace('</style>', css + '\n</style>', 1)
          if 'id="issue-splash"' not in html:
              html = html.replace('<body>', '<body>\n' + splash, 1)
          if 'const minimum=new Promise(resolve=>setTimeout(resolve,2000))' not in html:
              html = html.replace('</body>', script + '\n</body>', 1)

          path.write_text(html, encoding='utf-8')
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/apply-layout-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/2026-07-20/index.html .github/workflows/apply-layout-fixes.yml
          git commit -m "Refine article layout contrast and splash"
          git push
