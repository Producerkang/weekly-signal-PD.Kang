name: Apply issue 01 editorial revision once

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.issue.title == '[one-time] apply issue 01 editorial revision'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply editorial revision
        run: node tools/run-issue-01-editorial-migration.mjs
      - name: Validate publication
        run: node tools/validate-published-issue.mjs
      - name: Remove one-time migration scripts
        run: rm -f tools/apply-issue-01-editorial.mjs tools/run-issue-01-editorial-migration.mjs
      - name: Commit revised publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply issue 01 editorial revisions"
          git push
