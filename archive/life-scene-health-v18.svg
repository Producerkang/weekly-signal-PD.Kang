<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" role="img" aria-labelledby="title desc">
  <title id="title">응급실 전원을 기다리는 보호자</title>
  <desc id="desc">세로형 병원 복도에서 약 봉투와 휴대전화를 든 젊은 보호자가 환자의 전원을 기다리는 편집용 일러스트레이션</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe5dc"/>
      <stop offset="1" stop-color="#c4cdc0"/>
    </linearGradient>
    <linearGradient id="hall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1eee6"/>
      <stop offset="1" stop-color="#d6d8cf"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#28322a" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="720" height="960" fill="url(#bg)"/>
  <rect x="42" y="46" width="636" height="868" rx="4" fill="#ebe9e1" stroke="#aeb7aa" stroke-width="2"/>

  <!-- Hospital corridor -->
  <path d="M108 110H612V635L472 760H248L108 635Z" fill="url(#hall)"/>
  <path d="M108 635L248 760H472L612 635" fill="#b8bdb4"/>
  <path d="M360 110V760" stroke="#c5c9c0" stroke-width="2"/>
  <path d="M108 635L360 470L612 635" fill="none" stroke="#c3c8be" stroke-width="2"/>

  <!-- Ceiling lights -->
  <g fill="#fffdf5" stroke="#c7cbc1" stroke-width="2">
    <rect x="164" y="144" width="118" height="28"/>
    <rect x="438" y="144" width="118" height="28"/>
    <rect x="246" y="224" width="82" height="20"/>
    <rect x="392" y="224" width="82" height="20"/>
  </g>

  <!-- Treatment-room doors -->
  <g stroke="#89978a" stroke-width="3">
    <rect x="130" y="300" width="116" height="250" fill="#728579"/>
    <rect x="474" y="300" width="116" height="250" fill="#728579"/>
  </g>
  <g fill="#eef2eb">
    <circle cx="226" cy="426" r="5"/>
    <circle cx="494" cy="426" r="5"/>
  </g>
  <g fill="#fff" opacity=".85">
    <rect x="157" y="338" width="62" height="10"/>
    <rect x="501" y="338" width="62" height="10"/>
  </g>

  <!-- Transfer route motif -->
  <g transform="translate(522 82)">
    <path d="M0 0V160" stroke="#4f6f5e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="11" fill="#4f6f5e"/>
    <circle cx="0" cy="80" r="11" fill="#8a7046"/>
    <circle cx="0" cy="160" r="11" fill="#865864"/>
    <path d="M15 0h62M15 80h62M15 160h62" stroke="#7d877d" stroke-width="2"/>
    <g fill="#586159">
      <rect x="24" y="-8" width="36" height="5"/>
      <rect x="24" y="72" width="48" height="5"/>
      <rect x="24" y="152" width="41" height="5"/>
    </g>
  </g>

  <!-- Bench -->
  <g filter="url(#shadow)">
    <rect x="112" y="676" width="346" height="42" rx="4" fill="#59665d"/>
    <rect x="132" y="714" width="20" height="94" fill="#465148"/>
    <rect x="416" y="714" width="20" height="94" fill="#465148"/>
  </g>

  <!-- Waiting daughter, simplified editorial figure -->
  <g transform="translate(196 482)" filter="url(#shadow)">
    <circle cx="108" cy="64" r="48" fill="#d4a78e"/>
    <path d="M67 61C70 18 93 0 126 8C152 15 164 38 157 74C143 59 128 47 105 41C92 54 80 62 67 61Z" fill="#2e3430"/>
    <path d="M66 118C91 96 130 94 157 118L184 250H36Z" fill="#3e5548"/>
    <path d="M88 120L106 168L126 120" fill="#ece4d8"/>
    <path d="M49 154L7 234" stroke="#d4a78e" stroke-width="24" stroke-linecap="round"/>
    <path d="M170 154L218 220" stroke="#d4a78e" stroke-width="24" stroke-linecap="round"/>
    <rect x="185" y="188" width="48" height="78" rx="8" fill="#27322c" stroke="#d6ddd4" stroke-width="3"/>
    <rect x="191" y="198" width="36" height="52" fill="#dce7df"/>
    <path d="M44 246L18 366" stroke="#303934" stroke-width="34" stroke-linecap="round"/>
    <path d="M154 246L184 366" stroke="#303934" stroke-width="34" stroke-linecap="round"/>
    <path d="M4 374H62" stroke="#1e2521" stroke-width="22" stroke-linecap="round"/>
    <path d="M160 374H220" stroke="#1e2521" stroke-width="22" stroke-linecap="round"/>
  </g>

  <!-- Transparent bag with medicine envelope -->
  <g transform="translate(90 686)" filter="url(#shadow)">
    <path d="M0 0H106L96 154H10Z" fill="#f3f5ef" fill-opacity=".74" stroke="#8f9c90" stroke-width="3"/>
    <path d="M26 2C28-30 78-30 80 2" fill="none" stroke="#7b897d" stroke-width="6"/>
    <rect x="20" y="52" width="66" height="55" fill="#e2d6b7" stroke="#a99b79" stroke-width="2"/>
    <rect x="30" y="65" width="46" height="5" fill="#8d8065"/>
    <rect x="30" y="78" width="36" height="5" fill="#8d8065"/>
  </g>

  <!-- Time markers -->
  <g transform="translate(506 690)" fill="none" stroke="#59685d" stroke-width="3">
    <circle cx="64" cy="64" r="58"/>
    <path d="M64 24V64L91 82" stroke-linecap="round"/>
  </g>
  <g fill="#59685d">
    <rect x="496" y="834" width="148" height="6"/>
    <rect x="518" y="852" width="104" height="5" opacity=".62"/>
  </g>

  <rect x="42" y="46" width="8" height="868" fill="#6b825f"/>
</svg>