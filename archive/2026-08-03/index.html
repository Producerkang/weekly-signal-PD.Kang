<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WEEKLY SIGNAL 03 — 시작된 일들의 다음 장면</title>
<style>html,body{margin:0;background:#f2eee4}#loading{font:14px system-ui,sans-serif;padding:32px;color:#696b68}</style>
</head><body><div id="loading">WEEKLY SIGNAL을 불러오는 중입니다.</div>
<script>
(async()=>{
try{
 const r=await fetch('base.html',{cache:'no-store'}); if(!r.ok) throw new Error('base load failed');
 const text=await r.text(); const doc=new DOMParser().parseFromString(text,'text/html');
 const s=doc.createElement('style');
 s.textContent=`
 :root{--content:1040px;--prose:var(--content)!important;--wide:var(--content)!important}
 .contents-head,.toc,.life-head,.story,.scenario-note,.head,.prose,.metric-band,.timeline,.dual,.flow,.eval,.after-card,.source-group{width:min(var(--content),100%)!important;max-width:none!important;margin-left:auto!important;margin-right:auto!important}
 .life-sub,.contents-intro,.footer p{max-width:none!important}
 .cover-copy{width:min(calc(var(--content) + 2 * var(--g)),100%)!important}
 .cover h1,.cover-deck{max-width:none!important}
 .after-card{box-sizing:border-box}
 @media(max-width:1024px){.contents-head{grid-template-columns:1fr}.timeline{grid-template-columns:repeat(2,1fr)}.eval,.dual{grid-template-columns:1fr}}
 @media(max-width:700px){.toc,.metric-band,.timeline{grid-template-columns:1fr}}
 `;
 doc.head.appendChild(s);
 const footer=doc.querySelector('.footer p'); if(footer) footer.textContent='2026.08.03—08.09 · 설명형 주간 웹 매거진. 단일 Editorial Axis 지면으로 제작됐습니다.';
 document.open(); document.write('<!doctype html>'+doc.documentElement.outerHTML); document.close();
}catch(e){document.getElementById('loading').textContent='페이지를 불러오지 못했습니다.'}
})();
</script></body></html>
