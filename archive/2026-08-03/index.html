<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="weekly-signal-visuals" content="issue-03">
<title>WEEKLY SIGNAL 03 — 시작된 일들의 다음 장면</title>
<style>html,body{margin:0;background:#f2eee4}#loading{font:14px system-ui,sans-serif;padding:32px;color:#696b68}</style>
</head>
<body>
<div id="loading">WEEKLY SIGNAL을 불러오는 중입니다.</div>
<script>
(async()=>{
  try{
    const r=await fetch('base.html',{cache:'no-store'});
    if(!r.ok) throw new Error('base load failed');
    const text=await r.text();
    const doc=new DOMParser().parseFromString(text,'text/html');
    const style=doc.createElement('style');
    style.textContent=`
.section-visual{width:min(var(--wide),100%);margin:0 auto 52px}
.section-visual img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}
.life-visual{width:min(560px,100%);margin:0 auto 52px}
.life-visual img{aspect-ratio:3/4}
.dark .section-visual img{box-shadow:0 0 0 1px rgba(255,255,255,.08)}
@media(max-width:700px){.section-visual,.life-visual{margin-bottom:38px}}
`;
    doc.head.appendChild(style);
    function add(id,src,life=false){
      const sec=doc.getElementById(id);
      if(!sec) return;
      const header=sec.querySelector('header');
      if(!header) return;
      const fig=doc.createElement('figure');
      fig.className=life?'section-visual life-visual':'section-visual';
      const img=doc.createElement('img');
      img.src=src; img.alt=''; img.setAttribute('aria-hidden','true');
      fig.appendChild(img);
      header.insertAdjacentElement('afterend',fig);
    }
    add('life','assets/life.webp',true);
    add('cover-story','assets/cover-story.webp');
    add('economy','assets/economy.webp');
    add('politics','assets/politics.webp');
    add('society','assets/society.webp');
    add('tech','assets/tech.webp');
    const footer=doc.querySelector('.footer p');
    if(footer) footer.textContent='2026.08.03—08.09 · 설명형 주간 웹 매거진. 이 회차는 섹션별 이미지와 함께 구성된 HTML/CSS 지면으로 제작됐습니다.';
    document.open();
    document.write('<!doctype html>'+doc.documentElement.outerHTML);
    document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='페이지를 불러오지 못했습니다. <a href="base.html">원문 보기</a>';
  }
})();
</script>
</body>
</html>
