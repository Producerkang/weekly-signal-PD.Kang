<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>과월호 | WEEKLY SIGNAL</title>
<style>
:root{--ink:#101114;--paper:#f2eee4;--paper2:#faf8f2;--muted:#69675f;--line:#c9c2b4;--accent:#ff4a2f;--max:1040px}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--paper);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.65;word-break:keep-all}
a{color:inherit}
header{background:var(--ink);color:#fff;padding:17px clamp(18px,4vw,48px);display:flex;justify-content:space-between;align-items:center;gap:20px}
header strong{font-size:13px;letter-spacing:.15em}header a{color:#fff;text-decoration:none;font-size:12px;letter-spacing:.06em}
main{width:min(var(--max),calc(100% - 36px));margin:auto;padding:clamp(58px,8vw,108px) 0 110px}
.archive-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end;padding-bottom:34px;border-bottom:4px solid var(--ink)}
h1{font-family:"Noto Serif KR","Nanum Myeongjo",serif;font-size:clamp(48px,8vw,92px);line-height:1;letter-spacing:-.055em;margin:0 0 16px}.intro{color:var(--muted);margin:0;max-width:600px}
.sort-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.sort-label{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--muted);margin-right:3px}.sort-button{appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:9px 13px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.sort-button[aria-pressed="true"]{background:var(--ink);color:#fff}
.issue-list{list-style:none;margin:0;padding:0}.issue-item{border-bottom:1px solid var(--line)}.issue-link{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:clamp(20px,4vw,48px);align-items:center;padding:30px 4px;color:inherit;text-decoration:none;transition:background .16s ease,padding .16s ease}.issue-link:hover,.issue-link:focus-visible{background:rgba(255,255,255,.48);padding-left:14px;padding-right:14px}
.issue-meta{display:grid;gap:3px}.issue-seq{font-size:11px;font-weight:900;letter-spacing:.13em;color:var(--accent)}time{font-size:21px;font-weight:950;letter-spacing:-.03em}.issue-period{font-size:12px;color:var(--muted)}.issue-title{font-family:"Noto Serif KR","Nanum Myeongjo",serif;font-size:clamp(22px,3vw,34px);line-height:1.28;font-weight:800;letter-spacing:-.035em}.issue-summary{display:block;font-family:"Pretendard","Noto Sans KR",sans-serif;font-size:13px;font-weight:400;color:var(--muted);margin-top:7px;letter-spacing:0}.issue-open{font-size:11px;font-weight:900;letter-spacing:.12em;white-space:nowrap}.empty{display:none;padding:40px 0;color:var(--muted)}
@media(max-width:760px){.archive-head{grid-template-columns:1fr;align-items:start}.sort-box{justify-content:flex-start}.issue-link{grid-template-columns:1fr;gap:12px}.issue-open{display:none}}
</style>
</head>
<body>
<header><strong>WEEKLY SIGNAL</strong><a href="../">최신호 보기</a></header>
<main>
 <div class="archive-head">
  <div><h1>과월호</h1><p class="intro">발행 주차와 날짜를 기준으로 지난 WEEKLY SIGNAL을 다시 볼 수 있습니다.</p></div>
  <div class="sort-box" role="group" aria-label="과월호 정렬"><span class="sort-label">정렬</span><button class="sort-button" type="button" data-sort="latest" aria-pressed="true">최신순</button><button class="sort-button" type="button" data-sort="first" aria-pressed="false">1회부터</button></div>
 </div>
 <ol class="issue-list" id="issue-list">
  <li class="issue-item" data-date="2026-07-20" data-issue="1">
   <a class="issue-link" href="2026-07-20-reader.html">
    <span class="issue-meta"><span class="issue-seq">제1호</span><time datetime="2026-07-20">2026년 30주</time><span class="issue-period">2026.07.20–07.26</span></span>
    <span class="issue-title">9,500억 달러 AI 선언, 성패는 전력과 계약서에서 갈린다<span class="issue-summary">커버스토리와 경제·정치·사회·테크의 독립 대표 이슈를 명제와 근거 중심으로 다시 구성했습니다.</span></span>
    <span class="issue-open">ISSUE OPEN ↗</span>
   </a>
  </li>
 </ol>
 <p class="empty" id="empty">등록된 과월호가 없습니다.</p>
</main>
<script>
(()=>{
 const list=document.getElementById('issue-list');
 const buttons=[...document.querySelectorAll('.sort-button')];
 const sortIssues=mode=>{
  const items=[...list.querySelectorAll('.issue-item')];
  items.sort((a,b)=>mode==='first'?Number(a.dataset.issue)-Number(b.dataset.issue):b.dataset.date.localeCompare(a.dataset.date));
  items.forEach(item=>list.appendChild(item));
  buttons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.sort===mode)));
 };
 buttons.forEach(button=>button.addEventListener('click',()=>sortIssues(button.dataset.sort)));
 sortIssues('latest');
})();
</script>
</body>
</html>
