<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>과월호 | WEEKLY SIGNAL</title>
  <style>
    :root {
      --navy: #10253f;
      --paper: #f6f1e8;
      --orange: #d56a32;
      --ink: #17202a;
      --muted: #66707a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      line-height: 1.7;
    }
    header {
      padding: 20px clamp(20px, 5vw, 72px);
      background: var(--navy);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header a { color: white; text-decoration: none; }
    main {
      width: min(860px, calc(100% - 36px));
      margin: 0 auto;
      padding: 64px 0 96px;
    }
    h1 { font-size: clamp(36px, 7vw, 64px); margin-bottom: 12px; }
    .intro { color: var(--muted); margin-bottom: 36px; }
    .empty {
      padding: 30px;
      background: rgba(255,255,255,.7);
      border-left: 5px solid var(--orange);
    }
    /* 자동화가 발행호를 추가할 때 아래와 같은 목록을 삽입합니다.
    .issue-list { list-style: none; padding: 0; }
    .issue-list li { border-top: 1px solid rgba(16,37,63,.15); }
    .issue-list a { display: block; padding: 20px 0; color: var(--navy); }
    */
  </style>
</head>
<body>
  <header>
    <strong>WEEKLY SIGNAL</strong>
    <a href="../">최신호로 돌아가기</a>
  </header>

  <main>
    <h1>과월호</h1>
    <p class="intro">발행일별로 보존된 WEEKLY SIGNAL을 다시 볼 수 있습니다.</p>
    <div class="empty">
      아직 발행된 과월호가 없습니다. 첫 발행 후 이 목록이 자동으로 갱신됩니다.
    </div>
  </main>
</body>
</html>
