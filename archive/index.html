<!doctype html>
<html lang="ko" data-latest-issue="2026-08-03">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="weekly-signal-latest-issue" content="2026-08-03">
<title>WEEKLY SIGNAL — 과월호</title>
<style>
:root{--ink:#101114;--paper:#f2eee4;--muted:#69675f;--line:#c9c2b4;--accent:#d9341f;font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}main{width:min(960px,100%);margin:auto;padding:70px clamp(22px,5vw,64px)}
header{border-top:8px solid var(--ink);padding-top:24px;margin-bottom:50px}.brand{font-size:12px;font-weight:950;letter-spacing:.18em;color:var(--accent)}
h1{font-family:"Noto Serif KR","Nanum Myeongjo",serif;font-size:clamp(44px,8vw,80px);letter-spacing:-.05em;line-height:1;margin:12px 0 18px}
header p{color:var(--muted)}.issue-list{display:grid}.issue{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:24px;align-items:center;padding:24px 0;border-top:1px solid var(--line);text-decoration:none}
.issue:first-child{border-top:4px solid var(--ink)}.period{font-size:12px;font-weight:900;color:var(--accent)}.title{font-family:"Noto Serif KR","Nanum Myeongjo",serif;font-size:24px;line-height:1.35}.arrow{font-size:20px}
.back{display:inline-block;margin-top:42px;font-weight:800;color:inherit}
@media(max-width:650px){.issue{grid-template-columns:1fr auto}.period{grid-column:1/-1}.title{font-size:21px}}
</style>
</head>
<body>
<main>
<header><div class="brand">WEEKLY SIGNAL</div><h1>과월호</h1><p>발행된 각 회차는 독립된 폴더에서 그대로 열립니다.</p></header>
<div class="issue-list" id="issue-list" aria-live="polite"></div>
<a class="back" href="../">최신호로 돌아가기</a>
</main>
<script>
fetch('../issues.json',{cache:'no-store'})
 .then(response=>{if(!response.ok)throw new Error('issues.json');return response.json()})
 .then(issues=>{
   const list=document.getElementById('issue-list');
   issues.forEach(issue=>{
     const link=document.createElement('a');
     link.className='issue';
     link.href='../'+issue.path;
     const period=document.createElement('span');period.className='period';period.textContent=issue.period.replace('/',' — ');
     const title=document.createElement('span');title.className='title';title.textContent=issue.title;
     const arrow=document.createElement('span');arrow.className='arrow';arrow.setAttribute('aria-hidden','true');arrow.textContent='↗';
     link.append(period,title,arrow);list.append(link);
   });
 })
 .catch(()=>{document.getElementById('issue-list').textContent='과월호 목록을 불러오지 못했습니다.'});
</script>
</body>
</html>
